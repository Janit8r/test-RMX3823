paths = ["drivers/ShengHidInput", "package/*Touch*", "package/*Button*", "scripts/*touch*", "scripts/gen-touch-firmware.py"]
inputs = ["Touch controller identity (candidates loaded by the family TWRP tree: goodix_ts, gt9916, gt9966, synaptics, tcm_S3910)", "SPI engine, chip-select, reset and IRQ GPIOs, regulator and clock", "SMMU stream and DMA addressing for the touch buffer", "Volume and power key GPIO/PMIC inputs"]
