name: UEFI firmware

# Builds SILICIUM_UEFI.fd for rmx3823 with Mu-Silicium. This is the layer that
# runs before XNU: if it does not fit the 0x300000 BootShim window, nothing
# later matters. Linux is enough for this step, so it costs a fraction of the
# macOS minutes the kernel build needs.

on:
  workflow_dispatch:
    inputs:
      silicium_ref:
        description: Mu-Silicium branch, tag or commit
        required: true
        default: main
      binaries:
        description: Vendor DXE binaries to link (salami = OnePlus 11, the only SM8550 OPPO set upstream)
        type: choice
        options: [salami, rmx3823]
        default: salami
      target:
        description: EDK II build target
        type: choice
        options: [RELEASE, DEBUG]
        default: RELEASE
      clean:
        description: Remove Build/ before compiling (slow, use after changing the DSC or FDF)
        type: boolean
        default: false
  push:
    tags: ["uefi-*"]

permissions:
  contents: read

# One firmware build at a time, across every ref. A new run supersedes the old
# one: this job clones ~5 GB and compiles for the best part of an hour, so two
# of them racing is worse than losing the older attempt.
concurrency:
  group: uefi-firmware
  cancel-in-progress: true

env:
  SILICIUM_REF: ${{ inputs.silicium_ref || 'main' }}
  BINARIES: ${{ inputs.binaries || 'salami' }}
  TARGET: ${{ inputs.target || 'RELEASE' }}
  CLEAN: ${{ inputs.clean || 'false' }}

defaults:
  run:
    shell: bash

jobs:
  firmware:
    name: Build SILICIUM_UEFI.fd
    # Mu-Silicium's own CI builds on ubuntu-24.04; pin the same image so the
    # apt package set setup_env.sh expects is the one it gets.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out the device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Mu-Silicium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Project-Silicium/Mu-Silicium
          ref: ${{ env.SILICIUM_REF }}
          path: Mu-Silicium
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Report the checkout
        run: |
          git -C Mu-Silicium log -1 --format='Mu-Silicium %h %s (%cs)'
          git -C Mu-Silicium submodule status | head -n 20
          du -sh Mu-Silicium Mu-Silicium/Binaries Mu-Silicium/Common/Mu 2>/dev/null || true
          df -h "$GITHUB_WORKSPACE"

      - name: Install host tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Install the toolchain directly. Mu-Silicium's setup_env.sh is not
          # used: it installs no device-tree compiler, pulls mono-devel for no
          # reason this build needs, and on the fourth attempt sat in one step
          # for over ten minutes. Everything it would have contributed is
          # covered below.
          #
          # Job logs need repository admin to download while annotations do not,
          # so each command is bounded by timeout and reports its own error text
          # as an annotation instead of only an exit code.
          LOG="$RUNNER_TEMP/host-tools.log"
          : > "$LOG"

          report() {
            echo "::error::$1"
            echo "--- $1 ---"
            tail -n 60 "$LOG" | grep -inE 'error|fatal|cannot|unable|not found|no matching|E:' | tail -n 6 || true
            tail -n 30 "$LOG" || true
          }
          run_step() {
            desc="$1"; shift
            printf '\n===== %s: %s =====\n' "$desc" "$*" >> "$LOG"
            if ! timeout 900 "$@" >> "$LOG" 2>&1; then report "$desc failed or timed out: $*"; return 1; fi
            echo "ok    $desc"
          }

          run_step "apt-get update" sudo apt-get update -qq \
            -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 || exit 1
          run_step "apt-get install" sudo apt-get install -y -qq --no-install-recommends \
              -o DPkg::Lock::Timeout=120 \
              build-essential uuid-dev iasl nasm device-tree-compiler \
              clang lld llvm gcc-aarch64-linux-gnu mtools \
              mono-devel ca-certificates-mono \
              python3 python3-pip python3-venv git curl gettext || exit 1

          # EDK II's python tooling. DeviceBuild.py imports these modules and
          # calls them in-process, so there is no `stuart` binary to look for.
          # --break-system-packages is required on 24.04.
          if ! run_step "pip requirements" \
              python3 -m pip install --break-system-packages --no-input \
              -r Mu-Silicium/pip-requirements.txt; then
            run_step "pip requirements (user)" \
              python3 -m pip install --user --no-input \
              -r Mu-Silicium/pip-requirements.txt || exit 1
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

          missing=""
          # llvm-objcopy is not optional: BootShim/Makefile calls it by name to
          # turn BootShim.elf into the binary that gets prepended to the FD, and
          # clang alone does not provide it. The `llvm` package is what supplies
          # the unversioned symlink.
          # mono is not optional either: stuart_update resolves mu_nasm through
          # NuGet, and NuGet refuses to run on Linux without it.
          for tool in clang lld llvm-objcopy aarch64-linux-gnu-gcc nasm dtc mono git; do
            command -v "$tool" > /dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing after install:$missing"
            echo "::error::PATH=$PATH"
            echo "--- /usr/local/bin ---"; ls -1 /usr/local/bin | head -n 30
            echo "--- ~/.local/bin ---";  ls -1 "$HOME/.local/bin" 2>/dev/null | head -n 30
            exit 1
          fi
          python3 -c 'from edk2toolext.invocables.edk2_platform_build import Edk2PlatformBuild; print("Edk2PlatformBuild importable")'
          clang --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1
          llvm-objcopy --version | head -n 1
          df -h "$GITHUB_WORKSPACE" | tail -n 1

      - name: Apply the rmx3823 platform package
        run: |
          sh uefi/apply.sh Mu-Silicium --binaries="$BINARIES"
          echo
          echo "==> resulting package"
          find Mu-Silicium/Platforms/Realme -maxdepth 2 -type f | sort
          grep -n "Binaries/" Mu-Silicium/Platforms/Realme/rmx3823Pkg/Include/*.inc | head -n 10 || true
          # DeviceBuild.py is the stuart entry point; if any salami name survives
          # it, the build looks in Platforms/OnePlus and dies before compiling.
          DB=Mu-Silicium/Platforms/Realme/rmx3823Pkg/DeviceBuild.py
          if grep -n 'salami' "$DB"; then
            echo "::error::$DB still refers to salami"
            exit 1
          fi
          grep -n 'ACTIVE_PLATFORM\|PackagesSupported\|"Platforms/Realme"' "$DB"
          python3 -c "import ast,sys;ast.parse(open('$DB').read());print('DeviceBuild.py parses')"

      - name: Build the firmware volume
        run: |
          cd Mu-Silicium
          # pip-requirements.txt is already installed by the toolchain step; not
          # repeating it here keeps the build step free of network waits.
          LOG="$RUNNER_TEMP/build.log"
          : > "$LOG"
          args=(-d rmx3823 -r "$TARGET")
          if [ "$CLEAN" = true ]; then args+=(-c); fi
          echo "python3 build_uefi.py ${args[*]}"
          # pipefail is on, so $? is build_uefi.py's own status. On failure the
          # tail of the log goes out as annotations, because the job log itself
          # needs repository admin to download.
          set +e
          python3 build_uefi.py "${args[@]}" 2>&1 | tee "$LOG"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::build_uefi.py exited $rc"
            echo "::error::Build=$([ -d Build ] && echo present || echo absent) Conf=$([ -d Conf ] && echo present || echo absent) BootShim.bin=$([ -f BootShim/BootShim.bin ] && echo present || echo absent)"
            tail -n 8 "$LOG" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::log: $line"
            done
            exit "$rc"
          fi
          df -h "$GITHUB_WORKSPACE"

      - name: Verify the firmware volume
        run: |
          FD="Mu-Silicium/Build/rmx3823Pkg/${TARGET}_CLANGPDB/FV/SILICIUM_UEFI.fd"
          # Keep the exit code: piping into tail would hide a failed check.
          if ! python3 ci/verify-fd.py --fd "$FD" --expect-base 0xA7100000 --list > verify-fd.txt; then
            tail -n 60 verify-fd.txt
            echo "::error::the firmware volume failed verification"
            exit 1
          fi
          tail -n 40 verify-fd.txt

      - name: Upload the firmware volume
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silicium-uefi-rmx3823
          path: |
            Mu-Silicium/Build/rmx3823Pkg/${{ env.TARGET }}_CLANGPDB/FV/SILICIUM_UEFI.fd
            Mu-Silicium/Build/rmx3823Pkg/${{ env.TARGET }}_CLANGPDB/FV/SILICIUM_UEFI.fd.gz
            Mu-Silicium/Build/rmx3823Pkg/${{ env.TARGET }}_CLANGPDB/FV/SILICIUM_UEFI.fd-bootshim
            Mu-Silicium/Build/rmx3823Pkg/${{ env.TARGET }}_CLANGPDB/FV/SILICIUM_UEFI.fd-bootshim.gz
            verify-fd.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silicium-uefi-logs-${{ github.run_attempt }}
          path: |
            Mu-Silicium/Build/**/*.log
            Mu-Silicium/Build/**/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## UEFI firmware: rmx3823"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Mu-Silicium | \`${SILICIUM_REF}\` |"
            echo "| Binaries | \`${BINARIES}\` |"
            echo "| Target | \`${TARGET}\` |"
            echo "| Result | ${GITHUB_JOB} |"
            echo
            echo "The firmware volume must be exactly \`0x300000\` bytes: that is the"
            echo "window \`uefi/configs/rmx3823.toml\` gives BootShim."
            echo
            echo "### Verification"
            echo
            echo '```'
            tail -n 25 verify-fd.txt 2>/dev/null || echo "no verification output"
            echo '```'
            echo
            echo "### build_uefi.py (last 60 lines)"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
