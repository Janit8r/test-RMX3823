[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot", "ShengPreflight"]
paths = ["proprietary-files.txt", "scripts/check-rmx3823.py", "board.toml", "uefi/**"]
inputs = ["Mu-Silicium platform package for RMX3823 (none exists upstream)", "the device's own FDT (dumped from /sys/firmware/fdt) as the boot-image DTB", "UEFI FD base/size and boot image header version accepted by the OPPO ABL"]
configuration = ["firmware.config = rmx3823; firmware.dsc = Platforms/Realme/rmx3823Pkg/rmx3823.dsc; firmware.fd = Build/rmx3823Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd", "firmware.defines: ENABLE_SECUREBOOT=1, MEMORY_PROTECTION=TRUE, SHIP_MODE=FALSE", "uefi/apply.sh derives Platforms/Realme/rmx3823Pkg from Platforms/OnePlus/salamiPkg, rewrites the package name in the fdf and Include/*.inc, and installs Resources/Configs/rmx3823.toml plus Resources/DTBs/rmx3823.dtb", "uefi/configs/rmx3823.toml: uefi_fd base 0xA7100000 size 0x300000, boot_image.header_version 4, kernel_compression gzip, append_dtb true"]
procedure = ["Run sh uefi/apply.sh <Mu-Silicium checkout>, then python3 build_uefi.py -d rmx3823 -r RELEASE", "Assert Build/rmx3823Pkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd is exactly 0x300000 bytes and contains at least 20 PE32 sections", "Test with fastboot boot before writing any partition"]
findings = ["Mu-Silicium has no SM8550 realme package: Platforms/Realme only carries bale_b (Palawan), bitra (Kona), senna_a and senna_bc (Palima). salami (OnePlus 11) is the only kalama OPPO-family package and the closest template.", "uefi_fd size is now a measured value, not a copy: the stock uefi_a partition holds an ELF wrapping a single FV of exactly 0x300000 bytes with a 0x48 header (3,006,856 bytes used, 138,800 free). base 0xA7100000 is confirmed to sit inside a free gap: the board's own reservations leave 0xA4F08000..0xA7605000 unclaimed.", "The kalama stock bootloader injects oplusboot.* and device_info.* into the DTB, so the firmware DTB must be the device's own tree. The uefi.img that shipped in the project root is NOT it: that FD contains OplusStorageDxe/OplusProject/PhoenixDxe and an X.509 subject of 'OPLUS SM8650 Attestation', i.e. it was built for SM8650, while this unit reports soc_id 519 (KALAMA) running kernel 5.15.180-android13-8. The device's own uefi_a is the DXE reference.", "The whole salami window block transfers unchanged because both boards are OPPO-family kalama: the device DT reserves 0xA7605000 (bootloader log) and 0xB8000000 + 0x2B00000 (cont_splash_region) at exactly salami's Log Buffer and Display Reserved addresses, and the largest free gap starts at exactly salami's DXE Heap base 0xBAB00000.", "apply.sh originally wrote its Resources/ and DTBs/ copies into the package directory when given a relative Mu-Silicium path, because it cd'd into the package before using $MUS. It now resolves MUS to an absolute path first, and uses sed-to-tempfile instead of sed -i so macOS BSD sed works.", "Renaming salamiPkg is not enough to build: DeviceBuild.py is the stuart entry point build_uefi.py drives, and it hardcodes PackagesSupported, Scopes, GetPlatformDscAndConfig, GetName, PRODUCT_NAME, ACTIVE_PLATFORM and a PackagesPath rooted at Platforms/OnePlus. Left alone the build looks for Platforms/OnePlus/rmx3823Pkg/rmx3823.dsc and stops before compiling anything. apply.sh now rewrites both salamiPkg and salami in that file and inserts Platforms/Realme as a search root, matching only the tuple entry with a quote directly before it so Silicium-ACPI/Platforms/OnePlus survives.", "USE_CUSTOM_DISPLAY_DRIVER is 0 in rmx3823.dsc, so the build links SiliciumPkg/Drivers/SimpleFbDxe rather than the vendor DisplayDxe. The vendor panel XMLs under Binaries/salami/RawFiles are therefore not embedded, and the panel must be brought up later by GopFramebuffer, not by the firmware."]
completion = ["Firmware image builds at the configured FD size, fastboot boot reaches the UniXNU menu, the framebuffer publishes at 1240x2772 and the documented reservations survive handoff."]
limits = ["No platform package built yet. The FD base is validated against free memory but not against the address the OPPO ABL actually loads the boot image to; /proc/iomem shows the Android kernel at 0xA8000000, which is where the UniXNU boot image will land.", "The 5 MiB uefi_a partition is backed up offline but not committed; evidence/uefi-img-drivers.txt is the committed record of its contents."]
next_action = ["Run the uefi.yml workflow, which applies the overlay, builds rmx3823Pkg and asserts the FD size and section count, then fastboot boot the result."]

