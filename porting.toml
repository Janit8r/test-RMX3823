schema_version = 1

[device]
name = "rmx3823"
soc = "SM8550"
os_profile = "ipados-17.7.11-21H461"
summary = "realme GT5 240W (RMX3823 CN, OPPO project 23603). Stage 1: repository, SoC pin and stage-1 component selection exist; the board's own FDT, memory map and partition table have been dumped from the device and are reflected in the DTS and MemoryMapLib. No image has been built or booted yet."

# Every evidence reference below is a path in this repository, so
# scripts/porting-record.py check can verify it exists. Raw captures live in
# evidence/ (see evidence/README.md for how each one was taken).

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["SM8550 SoC pin for UniXNU-sm8550-common", "iPadOS 17.7.11 profile (the only OS profile in UniXNU)", "board identity: realme RMX3823, OPPO project 23603, model RE5C33"]
configuration = ["board.soc = SM8550; board.soc_source = sm8550; board.os_profile = ipados-17.7.11-21H461; schema_version = 2", "kernel.defconfig = rmx3823_defconfig; device_tree.source = device:dts/rmx3823.dts with device_tree.include_dirs = soc:dts", "Stage-1 components: ArmDTPlatform, ArmCpu, SoftwareAES, XnuPrelink, DarwinBoot"]
procedure = ["Copy examples/device to UniXNU-rmx3823 and rename the defconfig and board DTS", "Run ./unixnu defconfig rmx3823_defconfig -D ../UniXNU-rmx3823, then ./unixnu fetch and ./unixnu status --json", "Review resolved profiles, source pins, overrides and patch order before adding any driver"]
findings = ["Device identity is confirmed from the running unit, not inferred: /sys/devices/soc0/soc_id = 519 (KALAMA), /sys/firmware/fdt model = 'Qualcomm Technologies, Inc. Kalama MTP,zonda-B', compatible 'qcom,kalama-mtp/qcom,kalama/qcom,mtp', board-id [8,1], and /proc/cmdline carries oplusboot.prjname=23603 with verifiedbootstate=orange.", "The unit is a 24 GB / 1 TB SKU: /memory maps 23.61 GiB in 7 populated ranges and userdata is 1,004,075,544,576 bytes (935 GiB). Sizes taken from the TWRP BoardConfig (super 8.5 GiB, userdata 217 GiB) describe a smaller variant and must not be used.", "UniXNU devices.toml lists 155 devices and none of them is a realme or OPPO phone, so RMX3823 has no sibling port to copy: only the SM8550 platform layer is shared.", "Tables merge in ARM64, SoC, OS, device order; ordinary arrays replace inherited arrays, so every added component must be re-listed in full.", "The only available OS profile is iPadOS 17.7.11 (iPad7,1 / j120ap, chip_id 0x8011). A phone port therefore boots a tablet identity; panel geometry, DPI and orientation have to be supplied by the board DTS and ADT overrides.", "dts/rmx3823.dts includes 'sm8550.dtsi', which ships in the SoC feed, not in this repository. That only resolves because board.toml sets device_tree.include_dirs = ['soc:dts']; any standalone dtc run has to pass the equivalent -i flag.", "The firmware build cannot rely on Mu-Silicium's setup_env.sh: it installs no device-tree compiler, and its apt list names packages that ubuntu-24.04 does not all carry. The workflow installs build-essential, uuid-dev, iasl, nasm, device-tree-compiler, clang, lld, gcc-aarch64-linux-gnu, mtools and python3-pip itself, then installs pip-requirements.txt with --break-system-packages so the stuart entry point DeviceBuild.py re-executes is on PATH. Both ~/.local/bin and /usr/local/bin are added to GITHUB_PATH for that reason.", "Downloading a job log through the API needs repository admin, so a red run reports only an exit code. Every command in the toolchain step therefore runs through a wrapper that, on failure, emits the real error text as an annotation; annotations are readable anonymously, which is what made the failures debuggable at all.", "BootShim/Makefile calls clang with --target=aarch64-linux-gnu for the object and then llvm-objcopy by name to produce BootShim.bin. Installing clang and lld is not enough: llvm-objcopy comes from the llvm package, and without it the build dies with 'make: llvm-objcopy: No such file or directory' before EDK II writes anything.", "mono is a hard dependency of the firmware build after all: stuart_update resolves mu_nasm@20016.1.1 through NuGet, and NuGet refuses to run on Linux without Mono on PATH ('Mono is required to run NuGet on non-Windows platforms'). mono-devel plus ca-certificates-mono is the fix; it is also why Mu-Silicium's setup_env.sh installs mono-devel, so that part of their list was not padding.", "The built volume is not laid out like the stock one. rmx3823.fdf wraps FVMAIN in FILE FV_IMAGE = 9E21FD93-... { SECTION GUIDED EE4E5898-3914-4259-9D6E-DC7BD79403CF PROCESSING_REQUIRED { SECTION FV_IMAGE = FVMAIN } }, and that GUID means EDK2 LZMA, not gzip. The payload is a 5-byte header (properties byte plus little-endian dictionary size) followed by a raw LZMA1 stream, which lzma.decompress() cannot read; ci/verify-fd.py decodes it explicitly, and without that the walk reports 0 PE32 images on a perfectly good build.", "A firmware volume that fails verification is the one worth inspecting, so the workflow force-pushes it to a firmware-build branch using the DEPLOY_KEY secret. That is the only way to get the artifact out of Actions without repository admin rights, and it is what makes debugging the FDF possible at all.", "UniXNU's own build runs on a macOS runner and had only a workflow_dispatch trigger, but dispatching needs a token with actions: write, which an SSH deploy key cannot provide; the workflow now also starts on unixnu-* tags so an ordinary git push can launch it. A tag push carries no inputs, so the example-board patch is conditioned on github.event_name != 'workflow_dispatch' instead of inputs.allow_example, and the hardcoded /Applications/Xcode_<version>.app path was replaced by a step that prefers the requested point release and falls back to the newest Xcode_* app installed: the image ships one version, and a wrong path would otherwise fail a multi-hour run on its first step."]
completion = ["All source pins resolve; status shows the intended profiles, components and patch order; porting-record.py check reports no identity errors."]
limits = ["board.example is still true, so build and bootimg refuse this repository.", "The SoC commit in feeds.toml is the revision components.toml references for Sm8550Platform and has not been re-reviewed against UniXNU-sm8550-common HEAD."]
next_action = ["Review UniXNU-sm8550-common at the pinned commit, then run defconfig, fetch and status --json on a Linux or macOS host."]

