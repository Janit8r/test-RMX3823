[[area]]
id = "storage"
status = "planned"
components = ["ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot"]
paths = ["drivers/ShengUfs", "scripts/*ufs*", "scripts/*storage*", "scripts/*userdata*"]
inputs = ["UFS host 0x01d84000/0x3000 and PHY 0x01d80000/0x2000 (same as sheng)", "UFS LUN layout, logical block size and GPT of the retail unit", "userdata first/last LBA for the UniXNU window", "apps SMMU stream ID for UFS"]
configuration = ["[userdata] first_lba / last_lba / lba_bytes = 4096 with OS and SystemOS windows", "CONFIG_XNU_NATIVE_UFS=y and component:ShengUfs in [kernel] archives"]
procedure = ["Read capacity and known blocks, then publish the root device", "Mount the OS volume and start launchd", "Exercise a persistent write inside the Data region and re-read it after reboot"]
findings = ["ShengUfs is board-scoped and verified only on sheng, but its controller constants match RMX3823 because both are SM8550 with the host at 0x01d84000. The stock DT names the host qcom,ufshc at 0x01d84000/0x3000 and the PHY qcom,ufs-phy-qmp-v4-kalama at 0x01d80000/0x2000, with ufs_ice at 0x01d88000 and ufs_ice_hwkm at 0x01d90000 per /proc/iomem.", "The unit is the 1 TB SKU: userdata is 1,004,075,544,576 bytes and super is 14,495,514,624 bytes, so any window computed from the TWRP BoardConfig (217 GiB userdata, 8.5 GiB super) is wrong for this device.", "The TWRP fstab of this family mounts userdata as f2fs with inlinecrypt and reserve_root=32768 on sysfs_path=/sys/devices/platform/soc/1d84000.ufshc, which fixes the LUN host path and the encryption mode for the Data region.", "sheng adopts the firmware request list instead of cold-initialising the controller; RMX3823 must be checked for the same handoff state before writing a PHY/reset sequence."]
completion = ["Host facts match the board inventory; SCSI capacity, GPT and known blocks are correct; the configured volume mounts and launchd starts; writes survive reboot."]
limits = ["No device run; the userdata window bounds are known in bytes but the GPT and LUN layout have not been read from inside UniXNU."]
next_action = ["Run scripts/dual_sys/partition.py inspect to capture GPT, block size and the exact userdata LBA range."]

