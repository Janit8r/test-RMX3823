procedure = ["Confirm firmware scanout geometry at 1240x2772 before touching the XNU backend", "Adapt the presentation backend and verify a known frame", "Implement the backlight transport and verify write/readback across the range"]
findings = ["Panel is identified from the stock cmdline, not guessed: msm_drm.dsi_display0 = qcom,mdss_dsi_oplus_zonda_tianma_nt37705_1240_2772_dsc_cmd, and dmesg prints the driver as [TM_NT37705]. Tianma panel, Novatek NT37705 DSI driver IC, 1240x2772, DSC, command mode, 60/120 Hz switching observed.", "sheng drives a KTZ8866 over GENI I2C. RMX3823 exposes brightness through the mdss panel0-backlight node, so the sheng backlight path cannot be copied: either the panel's DSI command path or an SPMI/PMIC path has to be implemented behind the same OS-facing service.", "The panel is a 1240x2772 DSC command-mode panel; the iPadOS profile assumes a tablet geometry, so ADT product overrides and orientation handling are part of this area, not of the userland.", "The firmware framebuffer is not the panel: the stock DT reserves cont_splash_region at 0xB8000000 + 0x2B00000 (44 MiB), which bounds the GOP scanout size for 1240x2772 at 4 bytes per pixel."]
completion = ["A known frame appears with correct geometry and colours, then userland presentation and backlight control work."]
limits = ["No GOP or panel evidence yet; the backlight transport is unimplemented for this board."]
next_action = ["Capture the firmware GOP mode at 1240x2772 and the stock panel DT node (timing, DSC, backlight) for the display porting work."]

