[[area]]
id = "memory"
status = "implemented"
components = ["ArmDTPlatform", "ArmSmmu4K"]
paths = ["dts/**", "package/*Smmu*", "scripts/*smmu*"]
inputs = ["Usable DRAM range after reservations", "reserved-memory set: gunyah, cpusys_vm, xbl logs, aop, smem, PIL/mpss, display, splash", "apps SMMU stream IDs for UFS, display and Wi-Fi"]
configuration = ["One contiguous 2 GiB memory window at 0x80000000 in dts/rmx3823.dts, matching [payload] dram_size", "Splash reservation appended through [[bootimg.dtb_node]] in board.toml", "MemoryMapLib.c carries the 40 reserved ranges plus the UEFI window block"]
procedure = ["Compare the stock DT memory node with the reserved-memory children and compute the usable range", "Record every handoff region before enabling DMA users", "Validate SMMU stream IDs against the stock DT iommus properties"]
findings = ["Measured DRAM: 23.61 GiB across 7 populated ranges (0x80000000+0xE00000, 0x811D0000+0x56E30000, 0xD8140000+0x20000, 0xE1BB0000+0x1E450000, 0x880000000+0x31300000, 0x8C0000000+0x140000000, 0xA00000000+0x400000000). The unit is the 24 GB SKU.", "43 reserved ranges, 0.65 GiB total, every one carrying its stock label (gunyah_hyp_region, smem_region, mpss_region, adspslpi_region, splash_region, mpss_dsm_region, trust_ui_vm_region, oem_vm_region, ...). They are reproduced verbatim in MemoryMapLib.c.", "Free gaps that matter: 0xA4F08000..0xA7605000 (39.0 MiB, holds the FD block), 0xA760D000..0xB8000000 (265.9 MiB, holds the 256 MiB kernel window) and 0xBAB00000..0xD4D00000 (418.0 MiB, holds the DXE heap).", "splash_region is 0xB8000000 + 0x2B00000, which is exactly the 44 MiB the UniXNU boot-image dtb_node example uses; that node is now a measured value rather than a placeholder.", "Two of the 43 reservations are duplicated by the UEFI window block and were dropped from the descriptor array to avoid overlapping entries: splash_region (-> Display Reserved) and botloader_mem at 0xA7605000 (-> Log Buffer). llcc_lpi_region folds into NOMAP.", "The XNU DRAM window is a separate decision from the 23.61 GiB the device reports. scripts/unixnu/devicetree.py refuses anything but one memory node with one range ('ADT handoff requires one contiguous DRAM range') and requires board.toml [payload] dram_size to equal it, so dts/rmx3823.dts declares 0x80000000 + 0x80000000 (2 GiB) exactly as UniXNU-sheng does. Inside that window the device backs 1888.6 MiB; the 159.4 MiB (7.8%) that it does not are the holes at 0x80E00000+0x3D0000, 0xD8000000+0x140000 and 0xD8160000+0x9A50000. ci/verify-dts.py recomputes both numbers and fails above 25% phantom.", "The UEFI FD (0xA7100000) and the kernel window (0xA8000000) both fall inside the declared 2 GiB, so the firmware and the kernel stay addressable from the ADT's point of view."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The kernel window is validated against free memory but not against the ABL load address; /proc/iomem shows the Android kernel at 0xA8010000, so the UniXNU boot image will land inside the same 256 MiB window.", "SMMU stream IDs are not yet extracted.", "The 2 GiB ADT window is deliberately smaller than the 23.61 GiB the device reports, and 159.4 MiB of it is not backed by DRAM. Raising it is a post-first-boot change that needs the reserved-memory set turned into ADT reservations.", "[payload.adt] owned_memory_size and root_match_volume_uuid are still placeholders, so ./unixnu build payload cannot run yet: sheng uses 0x130000000 for the same 2 GiB window but that value is not verified here, and the root volume UUID only exists after the first install."]
next_action = ["Enable storage and confirm that ShengUfs takes the apps SMMU without colliding with the display or Wi-Fi windows."]

