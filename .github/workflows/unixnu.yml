name: UniXNU build

# Runs the Mac-only half of the port on a GitHub macOS runner: ./unixnu drives
# Xcode, unifdef, lld and mtools to produce kernel.macho and, once a firmware
# volume exists, the boot image. Nothing is uploaded except the boot image and
# text logs; the IPSW members and the kernel itself are Apple software and stay
# on the runner.

on:
  # workflow_dispatch wants a token with actions: write, which a deploy key
  # cannot provide; a unixnu-* tag starts the same run over an SSH push.
  push:
    tags: [unixnu-*]
  workflow_dispatch:
    inputs:
      steps:
        description: What to build
        type: choice
        options: [kernel, kernel+bootimg]
        default: kernel
      xcode:
        description: Xcode version of the macos-26 image (/Applications/Xcode_<version>.app)
        required: true
        default: "26.6"
      unixnu_ref:
        description: UniXNU branch, tag or commit
        required: true
        default: main
      fd_run_id:
        description: Run id of a successful "UEFI firmware" run (empty picks the latest one)
        required: false
        default: ""
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      allow_example:
        description: Patch example = true to false in the runner checkout so ./unixnu build is allowed
        type: boolean
        default: true
      use_deploy_key:
        description: Check the device repository out over SSH with the DEPLOY_KEY secret
        type: boolean
        default: true

permissions:
  contents: read
  actions: read          # gh run download reads artifacts of another workflow

concurrency:
  group: unixnu-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  UNIXNU_REF: ${{ inputs.unixnu_ref || 'main' }}
  # A tag push carries no inputs, so the tag name selects the step set:
  # unixnu-v4-bootimg packs the boot image as well, a plain unixnu-vN does not.
  STEPS: ${{ inputs.steps || (contains(github.ref_name, 'bootimg') && 'kernel+bootimg') || 'kernel' }}
  UNIXNU_IPSW: ${{ inputs.ipsw_url || '' }}
  BOOTIMG: ${{ contains(inputs.steps, 'bootimg') || contains(github.ref_name, 'bootimg') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build with XNU
    # macos-26 is arm64 and carries the Xcode 26 line the build is developed
    # with; macos-latest has moved to images whose clang rejects -Werror flags.
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out the device repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: device
          ssh-key: ${{ inputs.use_deploy_key && secrets.DEPLOY_KEY || '' }}
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniXNU/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: unixnu
          persist-credentials: false

      - name: Initialise the UniXNU submodules
        working-directory: unixnu
        run: |
          # Every driver and kit is a git submodule, and the OS profile's patch
          # series resolves patches inside them: without this, defconfig dies
          # with 'patch missing: kits/XnuPrelink/patches/...' before a single
          # file is compiled. --depth is left off on purpose because the pinned
          # commits are usually not the branch tip, and a shallow fetch then
          # fails on an unadvertised object.
          git submodule update --init --recursive --jobs 4
          git submodule status --recursive | sed -n '1,25p'
          ls kits/XnuPrelink/patches | head -n 10

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Allow the example board
        # A tag push carries no inputs, and the example flag still has to be
        # patched or ./unixnu refuses the board outright.
        if: github.event_name != 'workflow_dispatch' || inputs.allow_example
        run: |
          # board.toml keeps example = true so the repository cannot be built by
          # accident. Flip it in the runner checkout only; nothing is committed.
          python3 -c "import pathlib,re; p=pathlib.Path('device/board.toml'); t=p.read_text(); n=re.sub(r'(?m)^example\s*=\s*true\s*$','example = false',t,count=1); p.write_text(n); print('example flag patched' if n!=t else 'example flag already false')"

      - name: Select Xcode
        run: |
          # The image carries one Xcode point release, not every one. Prefer the
          # requested version and fall back to the newest installed app, so a
          # 26.x rollover does not burn a whole run on a missing path.
          want="/Applications/Xcode_${{ inputs.xcode || '26.6' }}.app"
          if [ -d "$want" ]; then
            chosen="$want"
          else
            chosen=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$chosen" ] || [ ! -d "$chosen" ]; then
            echo "::error::no Xcode under /Applications; wanted $want; found: $(ls -d /Applications/Xcode_*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          echo "DEVELOPER_DIR=$chosen/Contents/Developer" >> "$GITHUB_ENV"
          echo "selected $chosen"

      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail "the device repository has no board.toml"
          [ -f device/configs/rmx3823_defconfig ] || fail "device/configs/rmx3823_defconfig is missing"
          [ -x unixnu/unixnu ] || fail "unixnu/unixnu is missing or not executable"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found at $DEVELOPER_DIR; installed: $(printf '%s ' /Applications/Xcode_*.app)"
          python3 device/ci/verify-repo.py --root device --unixnu unixnu

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find mig
          clang --version | head -n 1
          "$(brew --prefix llvm)/bin/clang" --version | head -n 1
          python3 --version
          missing=0
          for tool in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc xcodebuild; do
            path=$(command -v "$tool" || true)
            printf '%-10s %s\n' "$tool" "${path:-MISSING}"
            [ -n "$path" ] || missing=1
          done
          df -h "$GITHUB_WORKSPACE"
          exit "$missing"

      - name: Select the board
        working-directory: unixnu
        run: |
          # ./unixnu writes its real complaint to stdout, and the job log needs
          # repository admin to read, so every invocation is teed and its tail
          # re-emitted as annotations. Without this a failure here is only an
          # exit code, which is undebuggable.
          log="$RUNNER_TEMP/unixnu-defconfig.log"
          ./unixnu --help 2>&1 | tee "$RUNNER_TEMP/unixnu-help.log" || true
          set +e
          ./unixnu defconfig rmx3823_defconfig -D "$GITHUB_WORKSPACE/device" 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            ./unixnu status 2>&1 | tee -a "$log"
            rc=${PIPESTATUS[0]}
          fi
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::selecting the board failed with exit $rc"
            tail -n 40 "$log" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::unixnu: $line"
            done
            exit "$rc"
          fi

      - name: Fetch the sources
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          log="$RUNNER_TEMP/unixnu-fetch.log"
          set +e
          ./unixnu fetch 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            ./unixnu status --json > "$RUNNER_TEMP/status.json" 2>>"$log"
            rc=$?
          fi
          set -e
          df -h "$GITHUB_WORKSPACE" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::fetching the sources failed with exit $rc"
            tail -n 40 "$log" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::fetch: $line"
            done
            exit "$rc"
          fi

      - name: Build the kernel
        id: kernel
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          log="$RUNNER_TEMP/unixnu-kernel.log"
          set +e
          ./unixnu build kernel 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          df -h "$GITHUB_WORKSPACE" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::building the kernel failed with exit $rc"
            tail -n 40 "$log" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::kernel: $line"
            done
            exit "$rc"
          fi

      - name: Fetch the firmware volume
        if: env.BOOTIMG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.fd_run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" -w "UEFI firmware" -s success -L 1 \
              --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$RUN_ID" ] || { echo "::error::no successful UEFI firmware run; dispatch that workflow first"; exit 1; }
          echo "firmware volume from run $RUN_ID"
          mkdir -p "$RUNNER_TEMP/fd"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n silicium-uefi-rmx3823 -D "$RUNNER_TEMP/fd"
          # upload-artifact keeps the paths it was handed, so the volume lands at
          # Mu-Silicium/Build/.../FV/SILICIUM_UEFI.fd rather than at the download
          # root; looking it up by name is the only stable way to find it.
          find "$RUNNER_TEMP/fd" -type f | sed -n '1,15p'
          fd_path=$(find "$RUNNER_TEMP/fd" -name 'SILICIUM_UEFI.fd' -type f | head -n 1)
          if [ -z "$fd_path" ]; then
            echo "::error::artifact silicium-uefi-rmx3823 of run $RUN_ID has no SILICIUM_UEFI.fd"
            exit 1
          fi
          echo "FD_PATH=$fd_path" >> "$GITHUB_ENV"
          echo "firmware volume at $fd_path"
          python3 device/ci/verify-fd.py --fd "$fd_path" --expect-base 0xA7100000

      - name: Fetch BootShim and mkbootimg
        if: env.BOOTIMG == 'true'
        run: |
          # Only the main repository is needed: BootShim/BootShim.S and
          # Resources/Scripts/mkbootimg.py. The submodules are not.
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Project-Silicium/Mu-Silicium "$RUNNER_TEMP/Mu-Silicium"
          cd "$RUNNER_TEMP/Mu-Silicium"
          git sparse-checkout set BootShim Resources
          # Upstream arithmetic bug: BootShim.S puts FD_SIZE in the ARM64 image
          # size field, but the image handed to the ABL is the shim plus the
          # firmware volume, and ./unixnu bootimg rejects any header that says
          # otherwise. Only that one field is rewritten; the copy loop still
          # moves exactly FD_SIZE bytes because it loads the literal, not the
          # header value.
          python3 - <<'PY'
          import pathlib, re, sys
          path = pathlib.Path('BootShim/BootShim.S')
          source = path.read_text()
          patched, count = re.subn(r'(\.quad\s+FD_SIZE)(\s+/\*\s*Image Size\s*\*/)',
                                   r'\1 + (_Payload - _Head)\2', source, count=1)
          if count != 1:
              sys.exit('::error::the ARM64 image size line is gone from BootShim.S; upstream changed it')
          path.write_text(patched)
          print('BootShim.S image size now describes the shim plus the firmware volume')
          PY
          ls BootShim/BootShim.S Resources/Scripts/mkbootimg.py
          # bootimg reads [uefi_fd] from Resources/Configs/<config>.toml, and the
          # device tree comes from the board repository, so only the config is
          # installed here. apply.sh needs the full package tree, which is not
          # checked out in this sparse clone.
          mkdir -p Resources/Configs Resources/DTBs
          cp "$GITHUB_WORKSPACE/device/uefi/configs/rmx3823.toml" Resources/Configs/rmx3823.toml
          cp "$GITHUB_WORKSPACE/device/uefi/dtb/rmx3823.dtb" Resources/DTBs/rmx3823.dtb

      - name: Let the device tree patch reuse an existing node
        if: env.BOOTIMG == 'true'
        working-directory: unixnu
        run: |
          # board.toml asks for /reserved-memory/splash_region, and the tree
          # taken from the device already has that node with the same label and
          # reg. fdtput -c calls fdt_add_subnode, which aborts with
          # FDT_ERR_EXISTS instead of leaving the node in place, so ./unixnu
          # bootimg dies before it ever writes a property (unixnu-v6-bootimg).
          # Only that one call becomes idempotent: the property writes and
          # their fdtget round-trip still check every value from board.toml.
          python3 - <<'PY'
          import pathlib, sys
          path = pathlib.Path('scripts/unixnu/bootimg.py')
          source = path.read_text()
          old = "        run([fdtput, '-c', work, node['path']], capture=True)\n"
          new = (
              "        try:\n"
              "            run([fdtput, '-c', work, node['path']], capture=True)\n"
              "        except Error as exc:\n"
              "            if 'FDT_ERR_EXISTS' not in str(exc):\n"
              "                raise\n"
              "            log('bootimg: ' + node['path'] + ' is already in the device tree')\n"
          )
          if source.count(old) != 1:
              sys.exit('::error::the fdtput -c line is gone from scripts/unixnu/bootimg.py; upstream changed it')
          path.write_text(source.replace(old, new))
          print('patch_dtb now reuses a node the device tree already has')
          PY
          # Fail here rather than inside ./unixnu if the rewrite produced
          # something that is not Python any more.
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/unixnu/bootimg.py').read_text()); print('bootimg.py still parses')"

      - name: Let the boot image verifier read a v4 header
        if: env.BOOTIMG == 'true'
        working-directory: unixnu
        run: |
          # verify() unpacks a v0/v2 header: kernel address at 12, tags at 32,
          # page_size at 36. mkbootimg writes the v3/v4 layout instead, where
          # those bytes are ramdisk_size, a reserved word and another reserved
          # word, and the header is padded to pagesize rather than carrying it
          # (unixnu-v7-bootimg: "boot image header does not match the requested
          # parameters"). Upstream salami.toml asks for header_version 4 too,
          # so this is not a value this board chose wrong. v3/v4 has no load
          # addresses at all, so only the magic, the reserved word and the
          # header version can be compared; everything else still round-trips.
          python3 - <<'PY'
          import pathlib, sys
          path = pathlib.Path('scripts/unixnu/bootimg.py')
          source = path.read_text()
          old = (
              "    if data[:8] != b'ANDROID!' or second_size or version != image['header_version'] or page != image['pagesize']:\n"
              "        raise Error('boot image header does not match the requested parameters')\n"
              "    if kernel_address != image['base'] + image['kernel_offset'] or tags != image['base'] + image['tags_offset']:\n"
              "        raise Error('boot image load addresses do not match the requested offsets')\n"
          )
          new = (
              "    if image['header_version'] >= 3:\n"
              "        if data[:8] != b'ANDROID!' or second_size or version != image['header_version']:\n"
              "            raise Error('boot image header does not match the requested parameters')\n"
              "        page = image['pagesize']\n"
              "        kernel_address = tags = None\n"
              "    else:\n"
              "        if data[:8] != b'ANDROID!' or second_size or version != image['header_version'] or page != image['pagesize']:\n"
              "            raise Error('boot image header does not match the requested parameters')\n"
              "        if kernel_address != image['base'] + image['kernel_offset'] or tags != image['base'] + image['tags_offset']:\n"
              "            raise Error('boot image load addresses do not match the requested offsets')\n"
          )
          if source.count(old) != 1:
              sys.exit('::error::the header checks are gone from scripts/unixnu/bootimg.py; upstream changed them')
          source = source.replace(old, new)
          old2 = (
              "    return {'kernel_sha256': hashlib.sha256(kernel).hexdigest(), 'ramdisk_bytes': ramdisk_size,\n"
              "            'header_version': version, 'kernel_address': hex(kernel_address), 'tags_address': hex(tags)}\n"
          )
          new2 = (
              "    return {'kernel_sha256': hashlib.sha256(kernel).hexdigest(), 'ramdisk_bytes': ramdisk_size,\n"
              "            'header_version': version,\n"
              "            'kernel_address': None if kernel_address is None else hex(kernel_address),\n"
              "            'tags_address': None if tags is None else hex(tags)}\n"
          )
          if source.count(old2) != 1:
              sys.exit('::error::the verify() report is gone from scripts/unixnu/bootimg.py; upstream changed it')
          path.write_text(source.replace(old2, new2))
          print('verify() now reads a v3/v4 boot image header')
          PY
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/unixnu/bootimg.py').read_text()); print('bootimg.py still parses')"

      - name: Build the boot image
        id: bootimg
        if: env.BOOTIMG == 'true'
        working-directory: unixnu
        run: |
          log="$RUNNER_TEMP/unixnu-bootimg.log"
          set +e
          ./unixnu bootimg \
            --uefi "$RUNNER_TEMP/Mu-Silicium" \
            --fd "$FD_PATH" \
            --dtb "$GITHUB_WORKSPACE/device/uefi/dtb/rmx3823.dtb" \
            --target RELEASE 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          find out -name '*.img' | sort
          df -h "$GITHUB_WORKSPACE" || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::packing the boot image failed with exit $rc"
            tail -n 40 "$log" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::bootimg: $line"
            done
            exit "$rc"
          fi

      - name: Stage the boot image
        if: env.BOOTIMG == 'true'
        run: |
          image=$(find unixnu/out -name boot.img -type f | head -n 1)
          [ -n "$image" ] || { echo "::error::the boot image step produced no boot.img"; exit 1; }
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$image" "$RUNNER_TEMP/artifacts/rmx3823-boot.img"
          printf 'boot.img %s bytes\n' "$(wc -c < "$RUNNER_TEMP/artifacts/rmx3823-boot.img" | tr -d ' ')"
          python3 -c "
          import struct, sys
          data = open(sys.argv[1], 'rb').read(0x1000)
          if data[8:16] != b'ANDROID!':
              sys.exit('::error::the boot image does not start with ANDROID!')
          version = struct.unpack_from('<I', data, 0x28)[0]
          page = struct.unpack_from('<I', data, 0x24)[0]
          print('android boot image header v%d, page size %d' % (version, page))
          " "$RUNNER_TEMP/artifacts/rmx3823-boot.img"

      - name: Upload the boot image
        if: env.BOOTIMG == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-rmx3823-bootimg
          path: ${{ runner.temp }}/artifacts/rmx3823-boot.img
          if-no-files-found: error
          retention-days: 30

      - name: Collect the text logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          find unixnu/out -name '*.log' -size -4M 2>/dev/null | while read -r log; do
            cp "$log" "$RUNNER_TEMP/logs/$(echo "$log" | tr '/' '_')"
          done || true
          # The teed ./unixnu transcripts live in RUNNER_TEMP, not in out/.
          for log in "$RUNNER_TEMP"/unixnu-*.log; do
            [ -f "$log" ] && cp "$log" "$RUNNER_TEMP/logs/"
          done || true
          ls -l "$RUNNER_TEMP/logs" | head -n 40 || true

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unixnu-rmx3823-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Remove proprietary inputs
        if: always()
        run: |
          rm -rf unixnu/out/ipsw unixnu/out/feeds
          find unixnu/out -type d -name .cache -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/fd" "$RUNNER_TEMP/Mu-Silicium" "$RUNNER_TEMP/artifacts"

      - name: Summary
        if: always()
        env:
          KERNEL: ${{ steps.kernel.outcome }}
          BOOTIMG_RESULT: ${{ steps.bootimg.outcome }}
        run: |
          {
            echo "## UniXNU build: rmx3823"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| kernel | ${KERNEL:-skipped} |"
            echo "| bootimg | ${BOOTIMG_RESULT:-skipped} |"
            echo
            echo "UniXNU \`${UNIXNU_REF}\`, steps \`${STEPS}\`."
            echo
            echo "First attempt on the device is always a boot, never a flash:"
            echo '```'
            echo "fastboot boot rmx3823-boot.img"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
