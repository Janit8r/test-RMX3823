procedure = ["Fill the CPU nodes and /psci from the stock DT", "Run ./unixnu build kernel and check that every enabled CPU reaches its entry checkpoint", "Confirm timer and IPI handling on all cores before enabling storage"]
findings = ["Topology read from the device DT: 8 cores, /cpus #address-cells = <2> #size-cells = <0>, reg values 0x0/0x100/0x200 (capacity-dmips-mhz 820, A510 cluster), 0x300/0x400/0x500/0x600 (1800, A715/A710), 0x700 (1894, X3).", "The arch timer is /soc/timer with compatible arm,armv8-timer and clock-frequency 0x124F800 (19.2 MHz), which confirms the value the template only guessed at.", "PSCI is /soc/psci, compatible arm,psci-1.0, method = smc.", "dts/rmx3823.dts only adds unixnu,cluster-type to the SoC dtsi's cpu nodes instead of redeclaring them, so the measured MPIDRs and the arm,cortex-* compatible strings stay in one place."]
